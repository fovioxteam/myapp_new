name: Build and Deploy to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install Certificate and Provisioning Profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          # 1. Создание временного Keychain и установка по умолчанию
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          KEYCHAIN_PASSWORD="buildpassword"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # 2. Импорт сертификата P12
          P12_PATH=$HOME/cert.p12
          echo -n "$P12_BASE64" | base64 --decode -o "$P12_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 3. Установка профиля подписи
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$MOBILEPROVISION_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/Foviox_App_ios_app_store_1786387633.mobileprovision

      - name: Setup App Store Connect Auth Key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" | sed 's/\\n/\n/g' > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Build and Package IPA
        run: |
          # 1. Сборка бинарника
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          
          # 2. Создание каталога Payload
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          
          PROVISION_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/Foviox_App_ios_app_store_1786387633.mobileprovision"
          cp "$PROVISION_PATH" build/ios/ipa/Payload/Runner.app/embedded.mobileprovision
          
          # 3. Извлечение Entitlements из профиля
          security cms -D -i "$PROVISION_PATH" > provision.plist
          plutil -extract Entitlements xml1 provision.plist -o entitlements.plist
          
          # 4. Переподпись вложенных Frameworks и dylib (внутренняя подпись)
          find build/ios/ipa/Payload/Runner.app/Frameworks -type f \( -name "*.dylib" -o -name "*.framework" \) -exec codesign --force --sign "Apple Distribution" --keychain $HOME/Library/Keychains/build.keychain-db {} + 2>/dev/null || true
          
          # 5. Переподпись основного бандла с указанием Entitlements
          codesign --force --sign "Apple Distribution" --entitlements entitlements.plist --keychain $HOME/Library/Keychains/build.keychain-db build/ios/ipa/Payload/Runner.app
          
          # 6. Упаковка в IPA
          cd build/ios/ipa
          zip -qr Foviox.ipa Payload
          cd ../../..

      - name: Upload to App Store Connect
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/Foviox.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"